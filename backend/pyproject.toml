[project]
name = "backend"
version = "0.1.0"
description = "Uma aplicação que permite que o usuário monte e organize uma lista de jogos que ele pretende jogar."
authors = [
    {name = "Lucas",email = "lucas.caetano.reis@hotmail.com"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "pydantic (>=2.14.3,<3.0.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
