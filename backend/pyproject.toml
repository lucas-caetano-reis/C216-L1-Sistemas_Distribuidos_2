[project]
name = "backend"
version = "0.1.0"
description = "Backend do projeto da disciplina de Sistemas Distribuidos 2 (C216-L1) do INATEL, feito durante o segundo semestre de 2026."
authors = [
    {name = "Lucas",email = "lucas.caetano.reis@hotmail.com"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.4,<0.17.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
